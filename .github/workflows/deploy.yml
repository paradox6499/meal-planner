name: Deploy to GitHub Pages

# Прогоняет тесты (vitest — src/**/*.test.js, чистые функции без React), затем
# собирает Vite-проект и публикует dist/ на GitHub Pages. Упавший тест
# останавливает деплой ДО того, как сломанный код уйдёт на прод — раньше тут
# вообще не было проверок, кроме "собралось / не собралось".
#
# Разово перед первым запуском: Settings -> Pages -> Source ->
# "GitHub Actions" (не "Deploy from a branch") в самом репозитории.
#
# VITE_BACKEND_URL (Settings -> Secrets and variables -> Actions -> Variables,
# НЕ Secrets — это публичный адрес API, не секрет) — адрес сервера
# напоминаний (server/, деплоится отдельно на Render, см. server/README.md).
# Пока переменная не задана — просто не задана в сборке, фронтенд тихо не
# пытается ничего отправлять на бэкенд (см. src/lib/backend.js), остальное
# приложение работает как обычная статика.
#
# VITE_SUPPORT_URL (та же вкладка Variables) — t.me-ссылка для кнопки
# "Написать в поддержку" в Аккаунте (см. src/App.jsx). Значение —
# https://t.me/s_edim_bot (чат с самим ботом, не личный аккаунт — сервер
# сохраняет такие сообщения, см. server/src/webhook.js и команду /feedback
# в server/README.md). Не задана — кнопка просто не показывается.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
