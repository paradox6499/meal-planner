name: Server tests

# server/ — отдельно деплоящийся проект (Render, см. server/README.md), не
# часть сборки GitHub Pages (deploy.yml). Собственный CI нужен, потому что
# требует Node 22+ (node:sqlite) — другую версию, чем фронтенд, и не должен
# останавливать/задерживать деплой статики при падении.

on:
  push:
    branches: [main]
    paths: ["server/**"]
  pull_request:
    paths: ["server/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
